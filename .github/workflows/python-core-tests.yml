name: Python Core Tests (optional sidecar)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'tests/*.py'
      - 'requirements.txt'
      - '.github/workflows/python-core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'tests/*.py'
      - 'requirements.txt'
      - '.github/workflows/python-core-tests.yml'
  workflow_dispatch: {}

concurrency:
  group: python-core-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (src/core)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run Python tests
        run: python -m pytest tests -v
