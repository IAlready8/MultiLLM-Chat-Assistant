name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded workflow runs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache dependencies and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            .next/cache
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      # Fast-fail: Type check and lint before expensive operations
      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Now run tests and build (tests finish faster, so run first)
      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder
          NEXTAUTH_SECRET: test-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          API_KEY_ENCRYPTION_SEED: test-encryption-seed-placeholder

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: multillm_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/multillm_smoke
      NEXTAUTH_SECRET: ci-smoke-test-secret-32chars-min
      NEXTAUTH_URL: http://localhost:3000
      API_KEY_ENCRYPTION_SEED: ci-smoke-encryption-seed-32chars

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build

      - name: Start server and run smoke tests
        run: |
          npm run start &
          SERVER_PID=$!

          # Wait for server readiness with retry
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/config >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          bash scripts/smoke-test.sh --base-url http://localhost:3000

          kill $SERVER_PID 2>/dev/null || true

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true
