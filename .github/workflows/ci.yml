name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder
          NEXTAUTH_SECRET: test-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          API_KEY_ENCRYPTION_SEED: test-encryption-seed-placeholder

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: multillm_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/multillm_smoke
      NEXTAUTH_SECRET: ci-smoke-test-secret-32chars-min
      NEXTAUTH_URL: http://localhost:3000
      API_KEY_ENCRYPTION_SEED: ci-smoke-encryption-seed-32chars

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

      - name: Start server and run smoke tests
        run: |
          npm run start &
          SERVER_PID=$!

          # Wait for server readiness
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/config >/dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "Server failed to start"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          bash scripts/smoke-test.sh --base-url http://localhost:3000

          kill $SERVER_PID 2>/dev/null || true

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true
